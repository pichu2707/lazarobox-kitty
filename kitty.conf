# ╔══════════════════════════════════════════════════════════════╗
# ║  LazaroBox Kitty — aligned with lazarobox-wezterm palette   ║
# ║  https://github.com/pichu2707/lazarobox-wezterm             ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Font ────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        16.0

# Ligatures — JetBrains Mono ships with calt/clig/liga enabled by default;
# these lines make it explicit and survive any font-feature reset.
font_features JetBrainsMonoNerdFont-Regular      +calt +clig +liga
font_features JetBrainsMonoNerdFont-Bold         +calt +clig +liga
font_features JetBrainsMonoNerdFont-Italic       +calt +clig +liga
font_features JetBrainsMonoNerdFont-BoldItalic   +calt +clig +liga

# ── Cursor ──────────────────────────────────────────────────────
cursor                  #a4daa7
cursor_text_color       #191e28
cursor_shape            block
cursor_blink_interval   0.5
cursor_stop_blinking_after 0

# ── Scrollback ──────────────────────────────────────────────────
scrollback_lines 10000
# Pager for show_scrollback / show_last_command_output (opens with search)
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Performance ─────────────────────────────────────────────────
repaint_delay  8
input_delay    3
sync_to_monitor yes

# ── Window ──────────────────────────────────────────────────────
window_padding_width      10
hide_window_decorations   yes
initial_window_width      120c
initial_window_height     30c
window_border_width       1px
draw_minimal_borders      yes
active_border_color       #7fb4ca
inactive_border_color     #232a40
bell_border_color         #ffe066
resize_debounce_time      0.1
confirm_os_window_close   0

# Transparency — picom dual_kawase blur handles the frosted glass
# kitty must declare an ARGB visual so picom blurs what's behind it
background_opacity        0.95
dynamic_background_opacity yes

# ── Tab bar ─────────────────────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_background        #191e28
tab_title_template        " {title} "
active_tab_foreground     #7fb4ca
active_tab_background     #232a36
active_tab_font_style     bold
inactive_tab_foreground   #5c6170
inactive_tab_background   #191e28
inactive_tab_font_style   normal

# ── Mouse ────────────────────────────────────────────────────────
url_color               #7fb4ca
url_style               curly
open_url_with           default
url_prefixes            file ftp ftps git http https mailto news
detect_urls             yes
mouse_hide_wait         3.0
focus_follows_mouse     no

# ── Input & paste safety ─────────────────────────────────────────
# Quote pasted URLs at the prompt and confirm large / multiline pastes
paste_actions           quote-urls-at-prompt,confirm
# Never auto-run a command from trailing newlines in a paste
strip_trailing_spaces   smart

# ── Undercurl / underline (LSP diagnostics) ─────────────────────
undercurl_style         thin-sparse

# ── Misc ─────────────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.0
term                    xterm-kitty
close_on_child_death    no
allow_remote_control    yes
listen_on               unix:/tmp/kitty
shell                   /usr/bin/zsh
shell_integration       enabled

# ── LazaroBox Color Palette ──────────────────────────────────────
# Base derived from: https://github.com/pichu2707/lazarobox-wezterm

foreground              #7fb4ca
background              #191e28

# Selection
selection_foreground    #f3f6f9
selection_background    #263356

# Normal colors (ANSI 0-7)
color0   #191e28
color1   #cb7c94
color2   #b7cc85
color3   #ffe066
color4   #7fb4ca
color5   #c99ad6
color6   #7aa89f
color7   #f3f6f9

# Bright colors (ANSI 8-15)
color8   #5c6170
color9   #c4746e
color10  #a4daa7
color11  #e0c15a
color12  #a3b5d6
color13  #b99bf2
color14  #7fb4ca
color15  #f3f6f9

# ── Splits / Layouts ────────────────────────────────────────────
enabled_layouts         splits, stack, tall, fat

# ── Key bindings ─────────────────────────────────────────────────
# Namespaces (no key is bound twice):
#   ctrl+shift + hjkl        → move between panes
#   ctrl+shift + r > hjkl    → resize panes (vim-style chord)
#   ctrl+shift + arrows      → scroll / tab navigation
#   alt        + - \         → create splits

# Split panes
map alt+minus        launch --location=hsplit --cwd=current
map alt+backslash    launch --location=vsplit --cwd=current

# Navigate panes (vim-style)
map ctrl+shift+h     neighboring_window left
map ctrl+shift+l     neighboring_window right
map ctrl+shift+k     neighboring_window up
map ctrl+shift+j     neighboring_window down

# Resize panes — chord: ctrl+shift+r, then a vim key.
# Moved off ctrl+shift+arrows so it no longer collides with scroll.
map ctrl+shift+r>h   resize_window narrower 5
map ctrl+shift+r>l   resize_window wider 5
map ctrl+shift+r>k   resize_window taller 5
map ctrl+shift+r>j   resize_window shorter 5

# Pane picker + swap
# NOTE: ctrl+8/ctrl+9 avoided because on Spanish layout AltGr+8/9 = [ ]
map ctrl+shift+8     focus_visible_window
map ctrl+shift+x     swap_with_window

# Tabs
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+w     close_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab

# Font size
map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

# Clipboard
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard

# Scrollback
map ctrl+shift+up        scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down

# ── Productivity (shell integration) ─────────────────────────────
# Send the LAST command's output to the pager — killer for failed tests/builds
map ctrl+shift+g     show_last_command_output
# Open the full scrollback in the pager (with search)
map ctrl+shift+z     show_scrollback
# Reload this config live / edit it in $EDITOR
map ctrl+shift+f5    load_config_file
map ctrl+shift+f2    edit_config_file

# ── Hints — grab things off the screen with the keyboard ─────────
# Open a URL shown on screen
map ctrl+shift+e     open_url_with_hints
# Insert a file path shown on screen at the prompt
map ctrl+shift+f     kitten hints --type path --program -
# Built-in chords still work: ctrl+shift+p then f/l/w/n/y = path/line/word/hash/hyperlink
